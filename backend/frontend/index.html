<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Support</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="chat-page">
  <main class="chat-app">
    <header class="app-header">
      <div class="avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12z"></path>
        </svg>
      </div>
      <div>
        <h1>Customer Support</h1>
        <p>Ask a question and get an instant answer.</p>
      </div>
    </header>

    <div id="messages" class="messages" role="log" aria-live="polite"></div>

    <div id="examples" class="examples">
      <button type="button" class="chip">How long does delivery take?</button>
      <button type="button" class="chip">What is your return policy?</button>
      <button type="button" class="chip">What payment methods do you accept?</button>
    </div>

    <form id="chat-form" class="composer" autocomplete="off">
      <input id="message-input" type="text" maxlength="1000"
             placeholder="Type your question..." aria-label="Your question" required>
      <button id="send-button" type="submit" class="btn btn-primary">Send</button>
    </form>
  </main>

  <script src="/chat.js"></script>
</body>
</html>
